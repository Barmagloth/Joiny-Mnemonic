[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joiny-mnemonic-local-llm"
version = "0.1.0"
description = "Model-agnostic local extractor backend for Joiny-Mnemonic"
requires-python = ">=3.11"
dependencies = [
  "joiny-mnemonic>=0.6.0",
]

[project.entry-points."joiny_mnemonic.extractor"]
local-llm = "joiny_mnemonic_local_llm:create_plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
